[project]
name = "response-to-pdf-skill"
version = "0.1.0"
description = "Deterministic Markdown-to-PDF and approval-gated printing helpers"
requires-python = ">=3.14,<3.15"
dependencies = [
  "markdown-it-py>=4.0,<5",
  "playwright>=1.55,<2",
  "pygments>=2.19,<3",
  "pypdf>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "TRY",
  "UP",
]
ignore = [
  "COM812",
  "PLR0913",
  "PLR2004",
  "S310",
  "S603",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
